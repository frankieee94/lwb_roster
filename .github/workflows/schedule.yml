name: Daily Roster Update

on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * *' # HKT 19:30
    - cron: '30 14 * * *' # HKT 22:30
    - cron: '30 17 * * *' # HKT 01:30
    - cron: '30 20 * * *' # HKT 04:30
    - cron: '30 23 * * *' # HKT 07:30
    - cron: '30 2 * * *'  # HKT 10:30
    - cron: '30 5 * * *'  # HKT 13:30
    - cron: '30 8 * * *'  # HKT 16:30
  workflow_dispatch: # 允許手動觸發

permissions:
  contents: write # 允許 push 到 repo

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LOGIN_ID: ${{ secrets.LOGIN_ID }}
      LOGIN_PW: ${{ secrets.LOGIN_PW }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install Chrome
        run: |
          sudo apt update
          sudo apt install -y google-chrome-stable

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Python script
        run: python kmb_roster.py

      - name: Commit and push generated HTML
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add duty_roster.html
          git commit -m "📆 Update duty roster on $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes"
          git push
